name: Verify stabilization

on:
  push:
    branches:
      - fix/stabilizace-etapa-1
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests, debug build and instrumentation APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

  instrumentation-api36:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 36 emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build app and instrumentation APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Start API 36 emulator
        run: |
          echo "no" | avdmanager create avd --force --name georeminder-api36 --package "system-images;android-36;google_apis;x86_64" --device "pixel_6"
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd georeminder-api36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          booted=""
          for i in $(seq 1 90); do
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then
            cat emulator.log
            exit 1
          fi
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Android instrumentation tests
        run: |
          APP_APK=$(find app/build/outputs/apk/debug -name '*debug.apk' ! -name '*androidTest*' | head -n 1)
          TEST_APK=$(find app/build/outputs/apk/androidTest/debug -name '*.apk' | head -n 1)
          test -n "$APP_APK"
          test -n "$TEST_APK"
          adb install -r "$APP_APK"
          adb install -r "$TEST_APK"
          output=$(adb shell am instrument -w cz.jenda.georeminder.test/androidx.test.runner.AndroidJUnitRunner)
          echo "$output"
          echo "$output" | grep -q "OK ("

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          adb devices || true
          adb logcat -d -t 500 || true
          cat emulator.log 2>/dev/null || true
